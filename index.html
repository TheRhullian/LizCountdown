<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liz está chegando 🌸</title>
<meta name="description" content="Contagem regressiva para a chegada da Liz Gabriela de Almeida Damião.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="petals" aria-hidden="true" id="petals"></div>

<nav class="site-nav">
  <a href="index.html" class="nav-brand">Liz <span aria-hidden="true">🌸</span></a>
  <div class="nav-links">
    <a href="index.html" class="nav-link active">início</a>
    <a href="recados.html" class="nav-link">recados</a>
  </div>
</nav>

<header class="hero">
  <div class="ornament ornament-top-left" aria-hidden="true">
    <svg viewBox="0 0 200 200"><use href="#flower-branch"/></svg>
  </div>
  <div class="ornament ornament-top-right" aria-hidden="true">
    <svg viewBox="0 0 200 200"><use href="#flower-branch"/></svg>
  </div>

  <p class="eyebrow" id="eyebrow">está chegando</p>

  <div class="hero-photo" id="hero-photo">
    <img src="images/hero.jpg" alt="Foto da Liz" id="hero-img">
    <div class="hero-photo-placeholder" id="hero-placeholder">
      <svg viewBox="0 0 120 120" width="56" height="56" aria-hidden="true"><use href="#heart-flower"/></svg>
    </div>
  </div>

  <h1 class="baby-name">
    <span class="first-name">Liz</span>
    <span class="full-name">Gabriela de Almeida Damião</span>
  </h1>

  <div class="divider" aria-hidden="true">
    <svg viewBox="0 0 300 40"><use href="#divider-vine"/></svg>
  </div>

  <div id="countdown-wrap">
    <p class="countdown-label" id="countdown-label">faltam</p>
    <div class="countdown" id="countdown">
      <div class="time-box">
        <span class="time-value" id="days">00</span>
        <span class="time-unit">dias</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="hours">00</span>
        <span class="time-unit">horas</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="minutes">00</span>
        <span class="time-unit">min</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="seconds">00</span>
        <span class="time-unit">seg</span>
      </div>
    </div>
    <p class="due-date" id="due-date"></p>
  </div>

  <div id="arrived-wrap" class="arrived-wrap hidden">
    <p class="arrived-title">chegou! 🌸</p>
    <p class="arrived-date" id="arrived-date"></p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main>

  <section class="parents-section">
    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 300 40"><use href="#divider-vine"/></svg>
    </div>
    <p class="parents-intro">com todo amor, esperamos por você</p>
    <div class="parents-names">
      <span id="father-name"></span>
      <span class="amp">&amp;</span>
      <span id="mother-name"></span>
    </div>
  </section>

  <section class="gallery-section">
    <h2 class="section-title">nossos momentos</h2>
    <div class="divider small" aria-hidden="true">
      <svg viewBox="0 0 300 40"><use href="#divider-vine"/></svg>
    </div>
    <div class="gallery" id="gallery">
      <!-- preenchido via JS a partir de js/config.js -->
    </div>
  </section>

</main>

<footer class="site-footer">
  <svg viewBox="0 0 200 60" class="footer-flower" aria-hidden="true"><use href="#flower-branch-small"/></svg>
  <p>feito com carinho para a Liz 🌸</p>
</footer>

<!-- Sprite SVG com os ornamentos florais reutilizados no site -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="flower-branch">
      <path d="M10,190 C40,150 30,100 70,70 C100,45 140,40 180,20" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
      <path d="M70,70 C55,55 40,55 30,45" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.5"/>
      <path d="M100,55 C90,40 90,25 80,15" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.5"/>
      <g class="fl" transform="translate(35,40)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
      <g class="fl" transform="translate(82,14) scale(0.8)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
      <g class="fl" transform="translate(140,42) scale(1.05)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
      <g class="leaf" transform="translate(55,95) rotate(30)"><ellipse rx="10" ry="4"/></g>
      <g class="leaf" transform="translate(95,68) rotate(-20)"><ellipse rx="10" ry="4"/></g>
      <g class="leaf" transform="translate(150,32) rotate(15)"><ellipse rx="8" ry="3.5"/></g>
    </g>

    <g id="flower-branch-small">
      <path d="M10,45 C50,35 90,15 190,10" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.5"/>
      <g class="fl" transform="translate(45,32) scale(0.8)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
      <g class="fl" transform="translate(110,18) scale(0.7)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
      <g class="fl" transform="translate(165,10) scale(0.6)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
    </g>

    <g id="divider-vine">
      <path d="M0,20 C60,5 90,35 150,20 C210,5 240,35 300,20" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
      <g class="fl" transform="translate(150,20) scale(0.6)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
    </g>

    <g id="heart-flower">
      <g class="fl" transform="translate(60,60) scale(1.6)"><circle r="7" class="petal" cx="-6" cy="0"/><circle r="7" class="petal" cx="6" cy="0"/><circle r="7" class="petal" cx="0" cy="-6"/><circle r="7" class="petal" cx="0" cy="6"/><circle r="4" class="center"/></g>
    </g>
  </defs>
</svg>

<script src="js/config.js"></script>
<script src="js/petals.js"></script>
<script src="js/main.js"></script>
</body>
</html>
